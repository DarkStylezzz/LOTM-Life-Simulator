<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="description" content="Un simulador de vida en el mundo de Lord of the Mysteries: nacé, crecé, descubrí el mundo oculto y decidí qué precio pagar.">
<title>Lord of the Mysteries: Life Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Saltar al contenido</a>
<div id="app">

  <!-- ============ CREACIÓN DE PERSONAJE ============ -->
  <section id="screen-intro" aria-label="Nueva vida">
    <div class="intro-wrap">
      <h1 class="game-title">Lord of the Mysteries</h1>
      <div class="game-sub">— Life Simulator —</div>
      <div class="intro-card" id="intro-content"><!-- ui/intro.js --></div>
    </div>
  </section>

  <!-- ============ PARTIDA ============ -->
  <div id="screen-game" class="hidden">
    <nav id="sidebar" aria-label="Secciones"><!-- ui/shell.js --></nav>
    <div id="main-col">
      <header id="topbar"><!-- ui/shell.js --></header>
      <main id="main" tabindex="-1"><div id="content"></div></main>
    </div>
    <aside id="context-panel" aria-label="Panel contextual"><!-- ui/shell.js --></aside>
    <nav id="tabbar" aria-label="Secciones"><!-- navegación inferior (móvil) --></nav>
  </div>

  <!-- ============ FINAL / BIOGRAFÍA ============ -->
  <section id="screen-end" class="hidden" aria-label="Biografía"></section>

  <div id="overlay-root"></div>
  <div id="toast-container" role="status" aria-live="polite"></div>
</div>
